[platformio]
boards_dir = boards

[env:stratolink]
; Freeze the platform/tool graph used by the reviewed candidate. A floating
; `ststm32` silently changes STM32duino, HAL, CMSIS, and the GCC toolchain on a
; fresh machine even when every application library below is exact.
platform = ststm32@19.6.0
board = stratolink
framework = arduino
; Launch images are optimized release builds. J-Link still retains the ELF
; symbols needed for RAM diagnostics; enabling Arduino's debug serial in the
; flight image only keeps an unused LPUART alive and adds timing/power surface.
build_type = release

monitor_speed = 115200
upload_protocol = jlink
debug_tool = custom
debug_server =
    JLinkGDBServerCL
    -device
    STM32WLE5CC
    -if
    SWD
    -speed
    4000

lib_deps =
    ; Flight dependencies are exact, not floating.  A caret let otherwise
    ; identical environments resolve different GNSS (3.1.13/3.1.14) and
    ; RadioLib (7.6.0/7.7.1) releases, so a diagnostic could exercise code
    ; different from the binary we launch.
    sparkfun/SparkFun u-blox GNSS v3@3.1.13
    stm32duino/STM32duino Low Power@1.5.0
    ; Low Power 1.5.0 leaves its RTC dependency floating. RTC 2.0.0 changed
    ; APIs and made env:stratolink fail while the measured profile (1.9.0)
    ; passed, so pin the transitive dependency in the base flight graph.
    stm32duino/STM32duino RTC@1.9.0
    jgromes/RadioLib@7.6.0
build_unflags = -DCUSTOM_PERIPHERAL_PINS

build_flags =
    ; STM32duino's non-throwing-in-practice operator new returns malloc()
    ; directly.  Tell GCC that allocation may return null so constructors are
    ; never invoked through a null result; lorawan_init() then checks each
    ; RadioLib allocation and fails closed without touching the radio.
    -fcheck-new
    -D ARDUINO_ARCH_STM32
    -D ARDUINO_RAK3172_MODULE
    -D HAL_UART_MODULE_ENABLED
    -D HAL_IWDG_MODULE_ENABLED
    -D HAL_TIM_MODULE_ONLY
    -D ENABLE_HWSERIAL1
    -D PIN_SERIAL1_TX=PB_6
    -D PIN_SERIAL1_RX=PB_7
    ; LoRaWAN region is no longer compile-time pinned, runtime-selected
    ; from GPS lat/lon by region_manager.cpp.  Removed: -D REGION_US915.
    ; STM32duino delayMicroseconds() in wiring_time.h reads DWT->CYCCNT into a
    ; signed int32, so once elapsed cycles cross 0x7FFFFFFF (~45 s after the
    ; start capture at 48 MHz) the signed compare flips negative and the loop
    ; never exits.  RadioLib's SPI wrapper hits this inside lorawan_init() and
    ; the firmware never reaches loop().  Falls back to the SysTick path.
    -D DWT_DELAY_DISABLED
    -I include
    ; ADC sample time tuning for VSTOR/SOLAR, 1 MΩ + 1 MΩ dividers (R19/R21
    ; on solar, R22/R23 on VSTOR) make Thévenin source impedance 500 kΩ.
    ; STM32duino default 19.5 cycles at 4 MHz ADC clock (~5 µs) settles to
    ; <1% of source, too inaccurate for tier gating. The direct HAL path also
    ; divides the ADC clock to 250 kHz, so 160.5 cycles is ~642 µs and settles
    ; far beyond 12-bit accuracy. This define remains aligned with that sample
    ; choice for any framework-owned ADC path.
    -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_160CYCLES_5

build_src_filter = +<*> -<main_power_test.cpp> -<main_region_test.cpp> -<main_gps_diag.cpp> -<main_gps_diag2.cpp> -<main_gps_iprobe.cpp> -<main_gps_power_states.cpp> -<main_mic_test.cpp> -<main_meshtastic_diag.cpp> -<main_ctt_diag.cpp> -<main_ctt_tx_diag.cpp> -<main_b2b_diag.cpp> -<main_b2b_rf_diag.cpp>

; v1.1 removes the T3902 and uses the 7.50M charge-divider resistor.
; Preserve env:stratolink for existing v1 boards with the microphone fitted.
[env:stratolink_v1_1]
extends = env:stratolink
build_flags =
    ${env:stratolink.build_flags}
    -D STRATOLINK_MIC_PRESENT=0
    -D STRATOLINK_HW_V1_1=1

; Bench-soak build: identical flight firmware, but the Meshtastic-relay solar
; gate is relaxed to 0 mV so the relay engages indoors on a PSU (no real sun)
; for the long TTN+Meshtastic soak.  FLIGHT uses env:stratolink (3000 mV gate).
[env:stratolink_soak]
extends = env:stratolink
build_flags =
    ${env:stratolink.build_flags}
    -D RELAY_SOLAR_MIN_MV=0
    ; Indoor bench boards never get a GPS fix, so the GNSS-first cold-boot gate
    ; would hold the radio silent for the whole soak. Seed the region so the
    ; soak exercises join/uplink/relay. BENCH ONLY: env:stratolink (flight)
    ; does not define this, and the flight binary is grep-verified clean of it.
    -D BENCH_SEED_REGION
    ; pair with the SubGhz.h shim in lorawan.cpp so a fresh env links SubGhz.cpp
    -I "${platformio.packages_dir}/framework-arduinoststm32/libraries/SubGhz/src"

; Flight-representative POWER PROFILE build.  Identical to env:stratolink in
; every power-relevant gate (relay and CTT keep the real 3000 mV solar gate, so
; they stay closed on an indoor bench), but seeds the region so the board still
; joins and uplinks without a sky view.  env:stratolink_soak is NOT usable for a
; power profile: it sets RELAY_SOLAR_MIN_MV=0, which holds the radio in relay RX
; for the whole sleep interval and makes the duty cycle nothing like flight.
[env:stratolink_profile]
extends = env:stratolink
build_flags =
    ${env:stratolink.build_flags}
    -D BENCH_SEED_REGION
    -I "${platformio.packages_dir}/framework-arduinoststm32/libraries/SubGhz/src"

[env:gps_diag]
; Continuous-GPS bring-up diagnostic (see src/main_gps_diag.cpp). Runs the
; u-blox flat-out and exposes live SIV/fix state in the `gd` RAM struct, read
; over J-Link. Tells "GPS antenna dead" from "30 s/cycle budget too short".
extends = env:stratolink
build_src_filter = -<*> +<main_gps_diag.cpp>
; Only the u-blox lib, drop RadioLib/LowPower (RadioLib's STM32WL HAL needs
; SubGhz.h which isn't pulled in this minimal source set, and we don't use it).
lib_deps = sparkfun/SparkFun u-blox GNSS v3@3.1.13

[env:gps_diag2]
; Sleep/wake WEDGE diagnostic (see src/main_gps_diag2.cpp). Replicates the real
; firmware GPS cycle and measures per-cycle whether the module answers after its
; backup nap, `gw.consec_no_resp` climbing is the flight STALE bug, live.
extends = env:stratolink
build_src_filter = -<*> +<main_gps_diag2.cpp>
lib_deps = sparkfun/SparkFun u-blox GNSS v3@3.1.13

[env:gps_iprobe]
; GPS I2C wedge-probe (see src/main_gps_iprobe.cpp). Runs the real UART sleep/wake
; cycle AND probes the GPS DDC at I2C 0x42 each cycle (awake + in-backup) to learn
; whether a UART-wedged module still answers on I2C, a BBR-safe recovery path that
; would avoid the cold-start cost of a PA0 reset (EXTINT is GND-tied on this board).
; Adds Wire to the diag; still no RadioLib (avoids the SubGhz.h LDF error).
extends = env:stratolink
build_src_filter = -<*> +<main_gps_iprobe.cpp>
lib_deps = sparkfun/SparkFun u-blox GNSS v3@3.1.13

[env:gps_power_states]
; PPK2-only GNSS containment characterization. No radio and no target serial
; output: the fixed-duration phases are identified from the PPK2 time axis and
; mirrored in `gps_power_state_diag` for a read-only post-capture J-Link check.
; This environment is never a flight image.
extends = env:stratolink
build_src_filter = -<*> +<main_gps_power_states.cpp>
lib_deps = sparkfun/SparkFun u-blox GNSS v3@3.1.13

[env:power_test]
extends = env:stratolink
build_src_filter = +<main_power_test.cpp> +<power_adc.cpp>
lib_deps =
    ${env:stratolink.lib_deps}
    stm32duino/STM32duino RTC@1.9.0
build_flags =
    ${env:stratolink.build_flags}
    -I "${platformio.packages_dir}/framework-arduinoststm32/libraries/SubGhz/src"

[env:region_test]
; Stress test for runtime LoRaWAN region switching + TAMP session
; persistence.  Streams PASS/FAIL log over Serial1 @ 115200.  See
; src/main_region_test.cpp for what it exercises.
extends = env:stratolink
build_src_filter = -<main.cpp> -<main_power_test.cpp> -<main_ctt_diag.cpp> -<main_ctt_tx_diag.cpp> +<main_region_test.cpp>
              +<region_manager.cpp> +<lorawan.cpp> +<power_manager.cpp>
              +<devnonce_store.cpp> +<crypto_aes128.cpp> +<lorawan_crypto.cpp>
              +<lorawan_counter.cpp> +<lorawan_frame.cpp>
              +<power_adc.cpp> +<gps_ublox.cpp> +<sensors.cpp>
              +<sensor_tmp117.cpp> +<sensor_ms5611.cpp>
              +<sensor_lis2dh12.cpp> +<sensor_ltr390.cpp>
              +<mic_acoustic.cpp> +<telemetry.cpp>

[env:mic_test]
; Raw PDM/PCM mic bench capture (see src/main_mic_test.cpp).  Captures decoded
; PCM (9375 Hz) + a raw-PDM snippet into RAM, read over J-Link (savebin) by the
; host harness analysis/acoustic/mic_bench.py.  Self-contained: no LoRa/GPS/IWDG
; libs (avoids RadioLib's SubGhz.h LDF error, like the gps_diag envs).
extends = env:stratolink
build_src_filter = -<*> +<main_mic_test.cpp>
lib_deps =

[env:meshtastic_relay_diag]
; Meshtastic LongFast relay bench diagnostic (see src/main_meshtastic_diag.cpp).
; Auto-sequences sleep/standby/RX/TX/relay/mode-switch/BW500 and exposes the `mrd`
; RAM struct over J-Link (read with gdb `print mrd`). Inherits RadioLib + all build
; flags from env:stratolink; adds power_adc for VSTOR/solar logging.
extends = env:stratolink
build_src_filter = -<*> +<main_meshtastic_diag.cpp> +<power_adc.cpp>
; RadioLib's STM32WL HAL (Stm32wlHal.cpp) needs the bundled framework SubGhz library,
; which this minimal source set's LDF doesn't wire up (the full stratolink env reaches
; it via its larger graph; the gps_diag envs sidestepped it by dropping RadioLib).
; Two parts are needed: (1) the -I puts SubGhz.h on RadioLib's compile include path;
; (2) main_meshtastic_diag.cpp #includes <SubGhz.h> so the LDF compiles+links SubGhz.cpp.
build_flags =
    ${env:stratolink.build_flags}
    -D DEBUG_ENABLE=1
    -I "${platformio.packages_dir}/framework-arduinoststm32/libraries/SubGhz/src"

; CTT wildlife-tag listener bench diagnostic: back-to-back 434 MHz FSK listen
; windows on the flight radio path, printing decoded tag beeps. Flight
; detections are queued as typed fPort-11 events. Validate with a separate
; 434 MHz transmitter generating 2-FSK 25kbps/25kHz-dev, sync D3 91,
; 4B id + CRC-8; the connected RTL-SDR is receive-only.
[env:ctt_diag]
extends = env:stratolink
lib_deps =
    ${env:stratolink.lib_deps}
    stm32duino/STM32duino RTC@1.9.0
build_flags =
    ${env:stratolink.build_flags}
    ; Diagnostic-only: keep the receiver armed with covered solar panels.
    ; The normal flight image retains the 3000 mV solar-surplus entry/exit gate.
    -D RELAY_SOLAR_MIN_MV=0
    -I "${platformio.packages_dir}/framework-arduinoststm32/libraries/SubGhz/src"
build_src_filter = +<*> -<main.cpp> -<main_power_test.cpp> -<main_region_test.cpp> -<main_gps_diag.cpp> -<main_gps_diag2.cpp> -<main_gps_iprobe.cpp> -<main_gps_power_states.cpp> -<main_mic_test.cpp> -<main_meshtastic_diag.cpp> -<main_ctt_tx_diag.cpp> -<main_b2b_diag.cpp> -<main_b2b_rf_diag.cpp> -<b2b.cpp> +<main_ctt_diag.cpp>

; NOT FLIGHT: finite 434 MHz CTT/Motus test-tag emulator for a second
; StratoLink board. The fitted RAK3172-9 is outside its qualified band, so this
; image is fixed at the HP path's -9 dBm minimum, sends only 24 frames with a
; >=10 s quiet interval, then enters standby. Use only in a controlled bench
; RF arrangement. It proves protocol plumbing, not absolute tag sensitivity.
[env:ctt_tx_diag]
extends = env:stratolink
lib_deps = jgromes/RadioLib@7.6.0
build_flags =
    ${env:stratolink.build_flags}
    -D CTT_TX_DIAG_BUILD=1
    -I "${platformio.packages_dir}/framework-arduinoststm32/libraries/SubGhz/src"
build_src_filter = -<*> +<main_ctt_tx_diag.cpp>

; B2B store-and-forward self-test. Pure logic (b2b.cpp + main_b2b_diag.cpp),
; no radio, so a minimal filter keeps it independent of the flight build.
[env:b2b_diag]
extends = env:stratolink
lib_deps =                          ; pure logic: no GNSS/RadioLib/LowPower needed
build_flags =
    ${env:stratolink.build_flags}
build_src_filter = -<*> +<main_b2b_diag.cpp> +<b2b.cpp> +<crypto_aes128.cpp>

; NOT FLIGHT: bounded physical two-node B2B test using the production
; LongFast/authentication/queue path with a public diagnostic-only fleet key.
[b2b_rf_diag]
extends = env:stratolink
lib_deps =
    ${env:stratolink.lib_deps}
    stm32duino/STM32duino RTC@1.9.0
build_flags =
    ${env:stratolink.build_flags}
    -D B2B_RF_DIAG_BUILD=1
    -D RELAY_SOLAR_MIN_MV=0
    -include b2b_rf_diag_config.h
    -I "${platformio.packages_dir}/framework-arduinoststm32/libraries/SubGhz/src"
build_src_filter = +<*> -<main.cpp> -<main_power_test.cpp> -<main_region_test.cpp> -<main_gps_diag.cpp> -<main_gps_diag2.cpp> -<main_gps_iprobe.cpp> -<main_gps_power_states.cpp> -<main_mic_test.cpp> -<main_meshtastic_diag.cpp> -<main_ctt_diag.cpp> -<main_ctt_tx_diag.cpp> -<main_b2b_diag.cpp> +<main_b2b_rf_diag.cpp>

[env:b2b_rf_tx_diag]
extends = b2b_rf_diag
build_flags =
    ${b2b_rf_diag.build_flags}
    -D B2B_RF_DIAG_ROLE=1

[env:b2b_rf_rx_diag]
extends = b2b_rf_diag
build_flags =
    ${b2b_rf_diag.build_flags}
    -D B2B_RF_DIAG_ROLE=2
